<rect x="504" y="112" width="620" height="286" rx="32" fill="#202622" stroke="#45594c" stroke-opacity=".7"/>
<text x="538" y="157" font-size="21" font-weight="600" fill="#e6eee8">剩余额度</text>
<rect x="203" y="140" width="106" height="212" rx="53" fill="#202622" stroke="#425749"/>
<path d="M210 246V193a46 46 0 0 1 92 0v53" fill="none" stroke="#35473b" stroke-width="4"/>
<path d="M210 246V193a46 46 0 0 1 92 0v53" fill="none" stroke="#8ce9ae" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="82 100"/>
<path d="M302 246v53a46 46 0 0 1-92 0v-53" fill="none" stroke="#35473b" stroke-width="4"/>
<path d="M302 246v53a46 46 0 0 1-92 0v-53" fill="none" stroke="#8ce9ae" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="47 100"/>
<text x="256" y="181" text-anchor="middle" font-size="17" fill="#a0b0a5">5h</text>
<text x="256" y="224" text-anchor="middle" font-size="42" font-weight="600" fill="#e6eee8">82</text>
<text x="256" y="266" text-anchor="middle" font-size="17" fill="#a0b0a5">周</text>
<text x="256" y="310" text-anchor="middle" font-size="42" font-weight="600" fill="#e6eee8">47</text>
<circle cx="256" cy="333" r="3.5" fill="#8ce9ae"/>
<text x="538" y="197" font-size="19" font-weight="500" fill="#e6eee8">每 5 小时</text>
<text x="1090" y="197" text-anchor="end" font-size="25" font-weight="600" fill="#e6eee8">82%</text>
<rect x="538" y="212" width="552" height="5" rx="2.5" fill="#35473b"/>
<rect x="538" y="212" width="452.64" height="5" rx="2.5" fill="#8ce9ae"/>
<text x="538" y="243" font-size="16" fill="#a0b0a5">1 小时 58 分钟后重置</text>
<text x="538" y="283" font-size="19" font-weight="500" fill="#e6eee8">每周</text>
<text x="1090" y="283" text-anchor="end" font-size="25" font-weight="600" fill="#e6eee8">47%</text>
<rect x="538" y="298" width="552" height="5" rx="2.5" fill="#35473b"/>
<rect x="538" y="298" width="259.44" height="5" rx="2.5" fill="#8ce9ae"/>
<text x="538" y="329" font-size="16" fill="#a0b0a5">周一 19:26 重置</text>
<circle cx="543" cy="365" r="4" fill="#8ce9ae"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">两种额度，各有位置。</title>
<desc id="desc">5h 在上、周在下的竖版胶囊，点击同时查看两个周期。设计示意，82 与 47 为演示数值。</desc>
<defs>
<radialGradient id="ambient"><stop stop-color="#2e593e" stop-opacity=".48"/><stop offset="1" stop-color="#0e1411" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#f4faf6" stop-opacity=".97"/><stop offset="1" stop-color="#d7e5db" stop-opacity=".94"/></linearGradient>
</defs>
<rect width="1200" height="480" rx="20" fill="#0e1411"/>
<ellipse cx="665" cy="275" rx="490" ry="260" fill="url(#ambient)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<text x="48" y="46" font-size="12" letter-spacing="2" fill="#9aafa1">02 / DUAL QUOTA</text>
<text x="48" y="87" font-size="28" font-weight="600" fill="#e6eee8">两种额度，各有位置。</text>
<text x="1152" y="46" font-size="12" text-anchor="end" fill="#82968a">CODEX HUD / 设计示意</text>
<path d="M370 256h76m-7-6 7 6-7 6" fill="none" stroke="#617d6a" stroke-width="1.5" stroke-linecap="round"/>

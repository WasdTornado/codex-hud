<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Codex HUD — 保持专注，掌握余量。</title>
<desc id="desc">原生 macOS 额度悬浮工具。深色背景与薄荷绿环形仪表，82% 为示意数据。</desc>
<defs><radialGradient id="glow"><stop stop-color="#244d33" stop-opacity=".6"/><stop offset="1" stop-color="#0e1411" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="480" rx="20" fill="#0e1411"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<circle cx="70" cy="55" r="13" fill="none" stroke="#294433" stroke-width="3"/><circle cx="70" cy="55" r="13" fill="none" stroke="#8ce9ae" stroke-width="3" stroke-dasharray="67 82" transform="rotate(-90 70 55)"/>
<text x="96" y="63" font-size="23" font-weight="600" fill="#e6eee8">Codex HUD</text>
<text x="56" y="140" fill="#9fb3a5" font-size="11" letter-spacing="3">YOUR QUOTA. IN SIGHT.</text>
<text x="52" y="213" fill="#e6eee8" font-size="57" font-weight="600">保持专注。</text>
<text x="52" y="284" fill="#8ce9ae" font-size="57" font-weight="600">掌握余量。</text>
<text x="56" y="332" fill="#a1b0a5" font-size="17">把 Codex 剩余额度，放在桌面一角。</text>
<line x1="56" y1="378" x2="610" y2="378" stroke="#2c3931"/>
<text x="56" y="412" fill="#a1b0a5" font-size="13">原生 Swift</text><text x="190" y="412" fill="#a1b0a5" font-size="13">macOS 26+</text><text x="335" y="412" fill="#a1b0a5" font-size="13">Apple Silicon</text><text x="494" y="412" fill="#a1b0a5" font-size="13">免费 · 开源</text>
<rect x="700" y="44" width="432" height="392" fill="none" stroke="#354a3c"/>
<path d="M694 44h12m-6-6v12M1126 44h12m-6-6v12M694 436h12m-6-6v12M1126 436h12m-6-6v12" stroke="#7f9e88"/>
<circle cx="916" cy="240" r="185" fill="url(#glow)"/>
<circle cx="916" cy="236" r="151" fill="none" stroke="#52715b" stroke-width="3" stroke-dasharray="1 8"/>

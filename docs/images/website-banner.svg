<text x="722" y="68" fill="#a1b0a5" font-family="monospace" font-size="9" letter-spacing="1.4">CODEX HUD / QUOTA MONITOR</text>
<text x="916" y="201" text-anchor="middle" fill="#a1b0a5" font-size="10" letter-spacing="2">5H REMAINING</text>
<text x="908" y="278" text-anchor="middle" fill="#e6eee8" font-size="85" font-weight="400" letter-spacing="-4">82</text>
<text x="970" y="274" fill="#a1b0a5" font-size="21">%</text>
<circle cx="850" cy="311" r="3" fill="#8ce9ae"/><text x="862" y="315" fill="#a1b0a5" font-size="11">留有余量，继续创造。</text>
<text x="722" y="418" fill="#a1b0a5" font-family="monospace" font-size="10">WEEKLY <tspan fill="#8ce9ae">47%</tspan></text><text x="1109" y="418" text-anchor="end" fill="#91a295" font-size="9">示意数据</text>

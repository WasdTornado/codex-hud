[package]
name = "codex-hud-core"
version = "0.1.0"
edition = "2021"
authors = ["wasdTornado"]
license = "MIT"

[features]
test-fixtures = []

[[bin]]
name = "hud-fake-cli"
path = "tests/support/fake_cli.rs"
required-features = ["test-fixtures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

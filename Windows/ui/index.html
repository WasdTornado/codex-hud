<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex HUD · Windows 平台验证预览</title><link rel="stylesheet" href="style.css"></head>
<body><main id="surface"><button id="orb" aria-label="打开额度详情"><svg id="rings" aria-hidden="true"></svg><span id="numbers"></span><i id="warning"></i></button><section id="details" aria-label="额度详情" hidden><header><strong id="heading">剩余额度</strong><button id="close" aria-label="收起详情">×</button></header><div id="rows"></div><footer><span id="sync"></span><button id="refresh" aria-label="刷新额度">↻</button></footer><p id="error" role="status"></p></section></main>
<aside id="preview" hidden><img src="brand.png" alt="Codex HUD" width="40" height="40"><h1>Windows 界面预览</h1><p>全部为演示值 · 不连接账号<br>网页预览不验证 Windows 原生窗口、磨砂或托盘。</p><div><button data-fixture="dual">双周期</button><button data-fixture="single">单周期</button><button data-fixture="unknown">未知</button><button data-fixture="zero">零额度</button><button data-fixture="error">同步失败</button></div><div><button id="theme">切换外观</button><button id="visibility">隐藏浮窗</button></div><p id="preview-status" aria-live="polite"></p><small>Codex HUD · wasdTornado · MIT</small></aside><script type="module" src="app.js"></script></body></html>
